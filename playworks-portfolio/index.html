<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#061516">
  <link rel="icon" href="../favicon.ico">
  <title>Zuit Interactive Portfolio — Playworks</title>
  <meta name="description" content="Explore Zuit's portfolio as a genuine Unity Playworks browser experience.">
  <style>
    :root{color-scheme:dark;--accent:#83f3c4}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:#061516;color:#e9f1e9;font-family:Arial,Helvetica,sans-serif;overflow:hidden}.shell{height:100vh;height:100dvh;display:grid;grid-template-rows:auto 1fr;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}header{min-height:58px;padding:10px clamp(14px,3vw,34px);display:flex;align-items:center;justify-content:space-between;gap:18px;background:#081c1d;border-bottom:1px solid rgba(233,241,233,.12);z-index:2}.back,.fallback{color:inherit;text-decoration:none;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.back span{color:var(--accent);margin-right:8px}.fallback{padding:8px 10px;border:1px solid rgba(233,241,233,.18);border-radius:3px;color:#b6c8c5}.title{min-width:0;text-align:center}.title p{margin:0;color:var(--accent);font-size:10px;font-weight:800;letter-spacing:.16em}.title h1{margin:1px 0 0;font-size:clamp(14px,2vw,19px);white-space:nowrap}main{min-height:0;position:relative;background:#000}.playworks-frame{display:block;width:100%;height:100%;border:0;background:#000}.direct{position:absolute;right:14px;bottom:14px;padding:7px 9px;border:1px solid rgba(255,255,255,.22);border-radius:3px;background:rgba(6,21,22,.78);color:#d9e5e1;text-decoration:none;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;z-index:2}.back:focus-visible,.fallback:focus-visible,.direct:focus-visible{outline:3px solid #f5d25f;outline-offset:3px}@media(max-width:650px){header{display:grid;grid-template-columns:auto 1fr auto}.title p{display:none}.title h1{overflow:hidden;text-overflow:ellipsis}.fallback{font-size:0}.fallback::after{content:'WebGL';font-size:10px}}@media(max-width:430px){header{gap:9px;padding-inline:10px}.back{font-size:10px}.title h1{font-size:13px}.direct{display:none}}
  </style>
</head>
<body>
  <div class="shell">
    <header><a class="back" href="../"><span>←</span> Portfolio</a><div class="title"><p>GENUINE PLAYWORKS BUILD</p><h1>Zuit Interactive Portfolio</h1></div><a class="fallback" href="../isometric-portfolio/">WebGL fallback</a></header>
    <main><iframe id="playworks-frame" class="playworks-frame" src="./iframe.html" title="Zuit interactive Playworks portfolio" allow="autoplay; fullscreen" allowfullscreen></iframe><a class="direct" href="./iframe.html">Open without frame ↗</a></main>
  </div>
  <script>
    const playworksFrame=document.querySelector('#playworks-frame');
    const playworksAssetOverrides={"22652":"../assets/media/portfolio-music.mp3","22864":"../assets/media/tower-albedo.jpg"};
    playworksFrame.addEventListener('load',()=>{
      playworksFrame.contentWindow.postMessage(JSON.stringify({name:'setPlaygroundAssetOverrides',data:JSON.stringify(playworksAssetOverrides)}),'*');
    });
  </script>
</body>
</html>
